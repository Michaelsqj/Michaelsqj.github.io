title: Qijia Shen
description: Research in agentic AI, reinforcement learning, training infrastructure, and computational imaging.
url: https://michaelsqj.github.io
baseurl: ""
lang: en
timezone: Asia/Shanghai

author:
  name: Qijia Shen
  github: Michaelsqj

markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

collections:
  reading:
    output: true
    permalink: /reading/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      section: writing
      math: true
  - scope:
      path: ""
      type: reading
    values:
      layout: reading-topic
      section: reading

plugins:
  - jekyll-feed
  - jekyll-scholar
  - jekyll-sitemap

scholar:
  source: ./_bibliography
  bibliography: papers.bib
  style: apa
  locale: en
  sort_by: year
  order: descending

exclude:
  - .agents
  - .github
  - .travis.yml
  - AGENTS.md
  - bin
  - blog
  - CONTRIBUTING.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - process.py
  - README.md
  - vendor
  - _education
  - _news
  - _pages
  - _projects
  - _posts/2015-03-15-formatting-and-links.md
  - _posts/2015-05-15-images.md
  - _posts/2015-07-15-code.md
  - _posts/2015-10-20-comments.md
  - _posts/2015-10-20-math.md
  - _posts/2018-12-22-distill.md
  - _posts/2020-09-28-github-metadata.md
  - _posts/2020-09-28-twitter.md
  - assets/bibliography
  - assets/css/main.scss
  - assets/js
  - assets/pdf

feed:
  path: feed.xml
